# Langfuse 可观测性配置（对齐官方实现）
# 使用方式：启动时添加 --spring.profiles.active=local,langfuse
#
# 观测链路：
#   Spring AI ChatModel.call()
#     -> Micrometer Observation（采集指标）
#     -> ChatModelCompletionContentObservationFilter（注入 prompt/completion 内容）
#     -> micrometer-tracing-bridge-otel（桥接为 OTel Span）
#     -> opentelemetry-exporter-otlp（OTLP/HTTP 导出）
#     -> Langfuse /api/public/otel（接收并展示 Trace）

spring:
  application:
    name: zhou-ai-agent
  ai:
    chat:
      observations:
        log-prompt: true      # 在 tracing 中记录 prompt 内容
        log-completion: true  # 在 tracing 中记录 completion 内容
otel:
  logs:
    exporter: none          # Langfuse 不支持日志导出，禁用避免 404
  metrics:
    exporter: none          # Langfuse 不支持指标导出，禁用避免 404
  exporter:
    otlp:
      # Langfuse 3 OTLP 端点（官方路径 /api/public/otel，SDK 自动追加 /v1/traces）
      endpoint: http://localhost:3000/api/public/otel
      # Langfuse 3 OTLP 认证：Basic Auth (publicKey:secretKey 的 Base64)
      # 首次启动后在 http://localhost:3000 创建项目获取密钥
      # 生成命令(git bash或PS): echo -n "pk-lf-xxx:sk-lf-xxx" | base64
      # 生成命令(纯PS): [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("pk-lf-xxx:sk-lf-xxx"))
      # 真实密钥配置在 application-dev.yml（不提交）
      headers:
        Authorization: "Basic cGstbGYtMTI1ZmQ4NTctMDczYS00OTNjLTlkOTAtMjVkMDAwODI5M2M0OnNrLWxmLTM3ZTYxZTJlLTQ5N2YtNGM5ZC1hN2YwLTgwM2QyZmYzMGYxYw=="
        x-langfuse-ingestion-version: "4"
  service:
    name: zhou-ai-agent

# OTel OTLP 导出超时：SDK 通过环境变量 OTEL_EXPORTER_OTLP_TIMEOUT 读取（单位 ms）
# 这里用 Spring Boot 的环境变量注入机制，确保大 Span（含完整 prompt/completion）不会超时
# 如果启动脚本不方便设环境变量，可在 JVM 启动参数加：-Dotel.exporter.otlp.timeout=30000
# OTel BatchSpanProcessor 优化（默认队列 2048、超时 30s）
# 可通过 JVM 参数调整：-Dotel.bsp.max.queue.size=4096 -Dotel.bsp.export.timeout=30000

management:
  tracing:
    sampling:
      probability: 1.0        # 采样率 100%（生产环境可降低）
  observations:
    annotations:
      enabled: true            # 启用 @Observed 注解

# OTel SDK JVM 参数配置（解决 OTLP 上报超时阻塞）
# 通过 Spring Boot 启动参数注入，无需修改代码：
# -Dotel.bsp.schedule.delay=5000       # 批量导出间隔 5s（默认5s）
# -Dotel.bsp.max.queue.size=4096       # 批量队列大小（默认2048，大Span易溢出）
# -Dotel.bsp.export.timeout=30000      # 单次导出超时 30s（默认10s，Langfuse需更长）
# -Dotel.exporter.otlp.timeout=30000   # OTLP HTTP 超时 30s（默认10s）

