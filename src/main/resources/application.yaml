spring:
  application:
    name: zhou-ai-agent
  profiles:
    active: local,pgmemory,langfuse
  mvc:
    favicon:
      enabled: false       # 禁用 favicon.ico 500 错误噪音（skill 指南推荐）
  ai:
    dashscope:
      # 需要替换为真实的 api key
      api-key: local-key
      chat:
        options:
          model: qwen-plus
    vectorstore:
      pgvector:
      index-type: HNSW
      distance-type: COSINE_DISTANCE
      # 如果不确定维度数可以不指定, 不给会默认根据实际维度数指定维度数量
      # 表一旦建好就不能更改维度值了, 最好在之前确认好模型维度
      dimensions: 1536
      max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
        # 标准io(stdio)使用第三方mcp或者自定义mcp server(自己开发)和客户端在同一服务器下,
        # mcp-servers.json 为mcp配置文件, 启动程序时会开子进程启动mcp, 能用 tool 不用 mcp
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
        sse:
          connections:
            server1:
              url: http://localhost:8127

  datasource:
    url: jdbc:postgresql://localhost:5432/zhou_ai_agent
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 30          # 默认10过小，RAG单次查询需4~6个连接×并发数
      minimum-idle: 10               # 保持最小空闲连接，减少冷启动延迟
      connection-timeout: 10000      # 获取连接超时 10s（默认30s过长，快速失败）
      idle-timeout: 300000           # 空闲连接存活 5min
      max-lifetime: 600000           # 连接最大存活 10min，避免 PostgreSQL 长连接积累
      leak-detection-threshold: 30000 # 连接泄漏检测 30s，慢查询告警
      validation-timeout: 3000       # 连接验证超时 3s（默认5s），快速剔除失效连接避免阻塞

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zhou.zhouaiagent.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn


# searchAPI
search-api:
  # 需要替换为真实的 key
  api-key: real api Key

# RAG 知识库初始化配置（启动时异步加载文档到 PgVector，设为 false 可跳过）
rag:
  init-on-startup: false
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG